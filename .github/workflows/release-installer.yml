name: Windows release installer

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to build and upload, for example v0.2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-installer:
    name: Build and verify Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Run unit tests
        shell: powershell
        run: dotnet test AvaPDF.slnx -c Release --nologo --verbosity minimal

      - name: Publish Native AOT
        shell: powershell
        run: powershell -File eng/publish-desktop.ps1 -RequireAot -DisableNativeDebugSymbols

      - name: Cache Inno Setup
        id: inno-setup-cache
        uses: actions/cache@v4
        with:
          path: C:\Program Files (x86)\Inno Setup 6
          key: inno-setup-6

      - name: Install Inno Setup
        if: steps.inno-setup-cache.outputs.cache-hit != 'true'
        shell: powershell
        run: winget install --id JRSoftware.InnoSetup --exact --silent --accept-package-agreements --accept-source-agreements

      - name: Build installer
        shell: powershell
        run: powershell -File eng/build-installer.ps1

      - name: Build Velopack update packages
        shell: powershell
        run: powershell -File eng/build-velopack.ps1

      - name: Verify install, context menu and uninstall
        shell: powershell
        run: powershell -File eng/test-installer.ps1 -SetupPath (Get-ChildItem artifacts/publish/*-win-x64-setup.exe).FullName

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AvaPDF-windows-release
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/publish/AvaPDF-*-win-x64-setup.exe
            artifacts/publish/AvaPDF-*-win-x64-aot.zip
            artifacts/velopack/AvaPDF-*.nupkg
            artifacts/velopack/AvaPDF-*-Setup.exe
            artifacts/velopack/releases.win.json
            artifacts/metrics/win-x64-aot.json
            artifacts/metrics/win-x64-aot.md

      - name: Attach assets to GitHub Release
        if: github.event_name == 'release' || inputs.release_tag != ''
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          $assets = @(
            (Get-ChildItem artifacts/publish -File) +
            (Get-ChildItem artifacts/velopack -File)
          ) |
            Where-Object { $_.Name -like 'AvaPDF-*-win-x64-setup.exe' -or $_.Name -like 'AvaPDF-*-win-x64-aot.zip' -or $_.Name -like 'AvaPDF-*.nupkg' -or $_.Name -like 'AvaPDF-*-Setup.exe' -or $_.Name -eq 'releases.win.json' } |
            ForEach-Object { $_.FullName }
          gh release upload $env:RELEASE_TAG $assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed: $LASTEXITCODE" }
